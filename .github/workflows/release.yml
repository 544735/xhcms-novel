name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: 构建发布包并创建 Release
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 显示版本
        shell: pwsh
        run: Get-Content VERSION

      - name: 构建发布包（ZIP）
        shell: pwsh
        run: ./scripts/package-release.ps1

      - name: 上传工作流产物
        uses: actions/upload-artifact@v4
        with:
          name: xhcms-novel-release
          path: release/*.zip
          retention-days: 30

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
