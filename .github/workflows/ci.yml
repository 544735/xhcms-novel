name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: 类型检查 / 单测 / 构建 / E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      # E2E 使用 PostgreSQL 服务容器（setup-env 会在每次测试前 reset + seed）
      DATABASE_URL: postgresql://xhcms:xhcms@localhost:5432/xhcms?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xhcms
          POSTGRES_PASSWORD: xhcms
          POSTGRES_DB: xhcms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xhcms -d xhcms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 启用 pnpm（corepack）
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 获取 pnpm store 路径
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: 缓存 pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 准备环境变量
        run: |
          cp apps/api/.env.example apps/api/.env
          cp apps/web/.env.example apps/web/.env.local

      - name: 生成 Prisma Client
        run: pnpm --filter @wmcms/api exec prisma generate

      - name: 构建共享类型包
        run: pnpm build:shared

      - name: 类型检查
        run: pnpm typecheck

      - name: Prisma Schema 校验
        run: pnpm --filter @wmcms/api exec prisma validate

      - name: 依赖漏洞审计（high 阻断）
        run: pnpm audit --audit-level high

      - name: 单元测试
        run: pnpm --filter @wmcms/api test:unit

      - name: 生产构建
        run: pnpm build

      - name: API E2E 测试
        run: pnpm --filter @wmcms/api test
