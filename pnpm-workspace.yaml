packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 用 allowBuilds 显式声明允许执行安装脚本的依赖（安全默认：其余一律不执行）
allowBuilds:
  prisma: true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  '@scarf/scarf': false

minimumReleaseAgeExclude:
  - react-hook-form@7.91.0
