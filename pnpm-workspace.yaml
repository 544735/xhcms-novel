packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 用 allowBuilds 显式声明允许执行安装脚本的依赖（安全默认：其余一律不执行）
allowBuilds:
  prisma: true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  '@scarf/scarf': false

minimumReleaseAgeExclude:
  - react-hook-form@7.91.0

overrides:
  multer: ^2.5.0
  deepmerge-ts: ^8.0.0
  postcss: ^8.5.12
  postcss-selector-parser: ^7.1.6
  zod: ^4.6.6
