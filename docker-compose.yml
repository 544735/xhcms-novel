# XHCMS Novel 2.0 —— Docker Compose 部署（应用 + PostgreSQL）
# 使用：
#   cp deploy/docker-env.example .env      # 填写 JWT 密钥与 POSTGRES_PASSWORD
#   docker compose up -d --build
#   docker compose logs -f
# 数据：PostgreSQL 数据在 xhcms-pg 卷，上传文件在 xhcms-data 卷。

name: xhcms

services:
  db:
    image: postgres:16-alpine
    container_name: xhcms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: xhcms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请复制 deploy/docker-env.example 为 .env 并填写 POSTGRES_PASSWORD}
      POSTGRES_DB: xhcms
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - xhcms-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xhcms -d xhcms"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      args:
        # 浏览器访问 API 的地址：本地用 localhost:4000；域名部署改为 https://your-domain.com/api/v1
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    image: xhcms-novel:${VERSION:-2.0.0}
    container_name: xhcms
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
      - "${API_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      API_PORT: 4000
      WEB_PORT: 3000
      DATABASE_URL: postgresql://xhcms:${POSTGRES_PASSWORD}@db:5432/xhcms?schema=public
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:3000}
      PUBLIC_BASE_URL: ${PUBLIC_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?请复制 deploy/docker-env.example 为 .env 并填写 JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?缺少 JWT_REFRESH_SECRET}
      JWT_MEMBER_SECRET: ${JWT_MEMBER_SECRET:?缺少 JWT_MEMBER_SECRET}
      # 决定 req.ip 的取值（限流分桶与审计 IP）。默认只信任 loopback：
      # 若在容器/宿主机前再加一层 nginx，请按实际部署设置（如 "1" 或代理网段），
      # 并避免把 4000 端口直接暴露到公网——否则客户端可伪造 X-Forwarded-For。
      TRUST_PROXY: ${TRUST_PROXY:-loopback}
      SEED_DEMO: 
      # 生产 seed 随机生成的管理员口令写入数据卷，便于首次登录读取
      SEED_CREDENTIALS_FILE: /data/.seed-credentials.txt${SEED_DEMO:-0}
    volumes:
      # 仅上传文件；数据库已迁移到 PostgreSQL 服务
      - xhcms-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  xhcms-data:
  xhcms-pg:
